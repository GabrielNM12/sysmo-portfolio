[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painel-ruptura"
version = "1.0.0"
description = "Painel de ruptura, margem e validade com alertas, lendo a base do ERP em modo somente leitura"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "psycopg[binary]>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
painel = "painel.cli:main"

[tool.setuptools.packages.find]
include = ["painel*"]

[tool.setuptools.package-data]
painel = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
