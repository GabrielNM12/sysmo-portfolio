quarkus.application.name=portal-recebimento
quarkus.http.port=8090
quarkus.http.test-port=8091

# ERP (S1) com o usuário do portal: lê pedidos de compra, grava notas de entrada, agenda no schema "portal"
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=portal_s5
quarkus.datasource.password=portal_s5
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.devservices.enabled=false

# Regras do recebimento
portal.tolerancia-preco-perc=0.5
portal.horarios=06:00,07:00,08:00,09:00,10:00,11:00,13:00,14:00,15:00
portal.antecedencia-minima-dias=1
# Laboratório: código de acesso inicial de todo fornecedor e login do operador do CD
portal.codigo-acesso-inicial=1234
portal.operador.usuario=operador
portal.operador.senha=operador

# front-end React (build do Vite em META-INF/resources) servido pelo próprio Quarkus
quarkus.http.enable-compression=true
quarkus.smallrye-openapi.info-title=Portal de Recebimento
quarkus.swagger-ui.always-include=true
