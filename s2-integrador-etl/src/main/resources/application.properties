# ---------------------------------------------------------------------------
# Integrador ETL · configuração
# ---------------------------------------------------------------------------
quarkus.application.name=integrador-etl
# a mesma porta usada no cadastro do webservice no S1 (simulador embutido em /sitemercado)
quarkus.http.port=8089
quarkus.http.test-port=8089

# Banco do ERP (S1) com o usuário de menor privilégio do integrador.
# Sobrescreva com QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=integrador_s2
quarkus.datasource.password=integrador_s2
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
quarkus.datasource.jdbc.max-size=8
# transações controladas explicitamente no código (uma por pedido)
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.devservices.enabled=false

# Grupos de processos carregados do classpath (pasta processos/)
integrador.grupos=processos/sitemercado-pedidos.yml
integrador.agendamento.intervalo=60s
integrador.agendamento.habilitado=true

# Simulador da API do SiteMercado embutido (desligue em produção)
simulador.habilitado=true
simulador.client-id=oeste-centro
simulador.client-secret=segredo-de-teste

quarkus.smallrye-openapi.info-title=Integrador ETL
quarkus.swagger-ui.always-include=true
quarkus.log.category."br.portfolio".level=INFO

%test.integrador.agendamento.habilitado=false
%test.quarkus.log.category."br.portfolio".level=DEBUG
